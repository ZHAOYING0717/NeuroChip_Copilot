[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurochip-copilot"
version = "0.4.0"
description = "Quality-aware electrophysiology phenotyping for neural organ chips and brain organoids"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {text = "MIT"}
authors = [{name = "NeuroChip Copilot Team"}]
dependencies = [
  "h5py==3.16.0",
  "joblib==1.5.3",
  "matplotlib==3.11.0",
  "networkx==3.6.1",
  "numpy==2.5.0",
  "openpyxl==3.1.5",
  "pandas==2.3.3",
  "plotly==6.5.2",
  "reportlab==4.4.9",
  "scikit-learn==1.9.0",
  "scipy==1.18.0",
  "streamlit==1.54.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]
report = ["pypdf==6.7.1", "pdfplumber==0.11.8"]
video = ["imageio-ffmpeg==0.6.0", "Pillow==12.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]
